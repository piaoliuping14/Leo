<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Leo桌宠</title>
<link rel="icon" href="../app-icon.ico">
<style id="theme-vars">
/* ===== 桌宠管理软件 - 设计令牌（复用 design 设计稿）===== */
/* Brand: 暖橙琥珀 — 呼应狮子形象，温暖有陪伴感 */
:root {
  --brand-background: #faf8f5;
  --brand-foreground: #2d2420;
  --brand-card: #ffffff;
  --brand-card-foreground: #2d2420;
  --brand-primary: #e8843c;
  --brand-primary-foreground: #ffffff;
  --brand-muted: #f5f0ea;
  --brand-muted-foreground: #8c7b6e;
  --brand-border: #e8e0d6;
  --brand-input: #e8e0d6;
  --brand-ring: #e8843c;
  --brand-radius-sm: 4px;
  --brand-radius-md: 10px;
  --brand-radius-lg: 16px;
  --state-success: #4caf7d;
  --state-warning: #f0a040;
  --state-error: #e05555;
  --state-info: #5b9bd5;
  --shadow-1: 0 1px 3px rgba(45,36,32,0.04), 0 1px 2px rgba(45,36,32,0.03);
  --shadow-2: 0 8px 24px -8px rgba(45,36,32,0.12);
  --font-sans: "Inter","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<style type="text/tailwindcss">
@theme inline {
  --color-background: var(--brand-background);
  --color-foreground: var(--brand-foreground);
  --color-card: var(--brand-card);
  --color-card-foreground: var(--brand-card-foreground);
  --color-primary: var(--brand-primary);
  --color-primary-foreground: var(--brand-primary-foreground);
  --color-muted: var(--brand-muted);
  --color-muted-foreground: var(--brand-muted-foreground);
  --color-border: var(--brand-border);
  --color-input: var(--brand-input);
  --color-ring: var(--brand-ring);
  --radius-sm: var(--brand-radius-sm);
  --radius-md: var(--brand-radius-md);
  --radius-lg: var(--brand-radius-lg);
}
@layer base { body { background: var(--brand-background); color: var(--brand-foreground); } }
</style>
<style>
  html, body { height: 100%; }
  .view { display: none; }
  .view.active { display: block; }
  .btn { transition: all .15s; cursor: pointer; }
  .btn-primary { background: var(--brand-primary); color: #fff; }
  .btn-primary:hover { opacity: .9; }
  .btn-ghost { background: transparent; border: 1px solid var(--brand-border); color: var(--brand-foreground); }
  .btn-ghost:hover { background: var(--brand-muted); }
  .cmd-item { transition: border-color .15s; }
  .cmd-item:hover { border-color: rgba(232,132,60,.4); }
  .cmd-del { opacity: 0; transition: all .15s; }
  .cmd-item:hover .cmd-del { opacity: 1; }
  .field { width:100%; height:36px; border:1px solid var(--brand-border); border-radius: var(--brand-radius-sm); background:#fff; padding:0 12px; font-size:14px; color: var(--brand-foreground); outline:none; }
  .field:focus { border-color: var(--brand-primary); }
  select.field { appearance:none; cursor:pointer; }
  .hidden { display:none !important; }
  /* 自定义滚动条 — 暖色调主题 */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--brand-border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--brand-muted-foreground); }
  /* 可滚动视图（设置页）；主页不滚动 */
  .view-scroll { height: 100%; overflow-y: auto; overflow-x: hidden; }
  /* 快捷指令页：固定 header + 列表区(约4成)与表单区(约6成)各自独立滚动，表单区超高才滚 */
  #view-commands.active { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  #view-commands .cmd-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; }
  #view-commands .form-region { max-height: 60%; overflow-y: auto; overflow-x: hidden; }
  /* 拖拽相关 */
  .cmd-grip { cursor: grab; user-select: none; }
  .cmd-grip:active { cursor: grabbing; }
  .drag-indicator { height: 3px; background: var(--brand-primary); border-radius: 2px; margin: 0; opacity: 0; transition: opacity .1s; }
</style>
</head>
<body class="font-sans antialiased" style="height:100%; overflow:hidden;">

<!-- ============ 主页 ============ -->
<main id="view-home" class="view active relative" style="height:100%;">
  <!-- 左上角设置按钮 -->
  <button id="btn-settings" class="btn absolute top-4 left-4 w-9 h-9 rounded-full flex items-center justify-center hover:bg-muted z-10 relative">
    <i data-lucide="settings" class="w-5 h-5 text-muted-foreground"></i>
    <span id="dot-settings" class="hidden absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border border-[var(--bg)]" style="background:var(--state-error)"></span>
  </button>
  <!-- 顶部昵称展示区：绝对定位在卡片上方空白处居中 -->
  <div class="absolute top-6 left-1/2 -translate-x-1/2 z-10 flex items-center" id="nickname-bar">
    <!-- 常态展示 -->
    <div id="nickname-view" class="flex items-center gap-1">
      <h2 class="text-base font-bold tracking-tight whitespace-nowrap">Hi，<span id="nickname-display" class="text-[var(--brand-primary)]">小Leo</span>！</h2>
      <button id="btn-edit-nickname" class="btn w-6 h-6 rounded-full flex items-center justify-center hover:bg-muted shrink-0" title="编辑昵称">
        <i data-lucide="pencil" class="w-3 h-3 text-muted-foreground"></i>
      </button>
    </div>
    <!-- 编辑态（平时隐藏）：Hi，[输入框]！ -->
    <div id="nickname-edit" class="hidden items-center whitespace-nowrap">
      <span class="text-base font-bold tracking-tight">Hi，</span>
      <input id="nickname-input" type="text" maxlength="10" class="field" style="width:60px; height:28px; padding:0 6px; font-size:16px; font-weight:bold; text-align:center; color:var(--brand-primary); border-color:var(--brand-primary);" value="小Leo" />
      <span class="text-base font-bold tracking-tight">！</span>
    </div>
    <!-- 用于测量文字宽度的隐藏 canvas -->
    <canvas id="nick-measure" style="display:none;"></canvas>
  </div>
  <div class="flex items-center justify-center p-4" style="height:100%;">
    <div class="w-full max-w-[400px] bg-card rounded-[var(--brand-radius-lg)] p-6 flex flex-col gap-5" style="box-shadow:var(--shadow-2)">
      <!-- 宠物状态 -->
      <section class="flex flex-col items-center gap-4">
        <div class="w-28 h-28 rounded-[var(--brand-radius-lg)] overflow-hidden bg-muted flex items-center justify-center" style="box-shadow:var(--shadow-1)">
          <img src="assets/lion-pet.png" alt="桌面宠物狮子" class="w-24 h-24 object-contain" style="margin-left:4px" />
        </div>
        <div class="flex items-center gap-2">
          <span id="status-dot" class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: var(--brand-muted-foreground);"></span>
          <span id="status-text" class="text-muted-foreground text-sm">Leo未启动</span>
        </div>
      </section>

      <!-- 控制按钮 -->
      <section class="flex flex-col gap-3">
        <button id="btn-start" class="btn btn-primary w-full py-3 rounded-[var(--brand-radius-md)] font-semibold text-base flex items-center justify-center gap-2" style="box-shadow:var(--shadow-1)">
          <i data-lucide="play" class="w-5 h-5"></i><span>启动宠物</span>
        </button>
        <button id="btn-commands" class="btn btn-ghost w-full py-3 rounded-[var(--brand-radius-md)] font-medium text-base flex items-center justify-center gap-2">
          <i data-lucide="list" class="w-5 h-5"></i><span>快捷指令配置</span>
        </button>
      </section>

      <!-- 提示 -->
      <div class="bg-muted rounded-[var(--brand-radius-md)] p-3 flex items-start gap-2">
        <i data-lucide="info" class="w-4 h-4 text-muted-foreground shrink-0 mt-0.5"></i>
        <p class="text-muted-foreground text-xs leading-relaxed">提示：单击宠物弹出对话气泡（快捷指令/音乐盒/时间）；右键宠物可回到右下角或退出。关闭本窗口桌宠自动退出。</p>
      </div>
    </div>
  </div>
</main>

<!-- ============ 快捷指令配置 ============ -->
<main id="view-commands" class="view">
  <!-- Header（固定） -->
  <div class="max-w-[400px] w-full mx-auto px-4 pt-6 pb-2 shrink-0">
    <div class="flex items-center gap-3">
      <button id="btn-back" class="btn w-9 h-9 rounded-full flex items-center justify-center hover:bg-muted shrink-0">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
      <div class="flex-1">
        <h1 class="text-xl font-bold tracking-tight">快捷指令</h1>
        <p class="text-sm text-muted-foreground mt-0.5">拖拽排序 · 点击编辑</p>
      </div>
    </div>
  </div>

  <!-- 可滚动列表区域 -->
  <div class="cmd-scroll">
    <div class="max-w-[400px] mx-auto px-4 pb-4 flex flex-col gap-4">
      <div id="command-list" class="flex flex-col gap-2"></div>
      <button id="btn-add" class="btn flex items-center justify-center gap-2 border-2 border-dashed border-border rounded-[var(--brand-radius-md)] px-4 py-4 hover:border-primary hover:bg-primary/[0.04]">
        <div class="w-8 h-8 rounded-full bg-muted flex items-center justify-center"><i data-lucide="plus" class="w-4 h-4"></i></div>
        <span class="text-sm font-medium text-muted-foreground">添加快捷指令</span>
      </button>
    </div>
  </div>

  <!-- 表单区域：最大 60% 高，内容超高才内部滚动；不固定底部，随内容流排列 -->
  <div class="form-region max-w-[400px] w-full mx-auto px-4 pb-8 pt-3">
    <div id="form-card" class="hidden bg-card border border-border rounded-[var(--brand-radius-md)] p-4 flex flex-col gap-3" style="box-shadow:var(--shadow-2)">
      <h3 id="form-title" class="text-sm font-semibold">新增指令</h3>
      <button id="btn-pick-app" type="button" class="btn flex items-center justify-center gap-2 bg-muted hover:bg-primary/[0.06] rounded-[var(--brand-radius-sm)] py-2 text-sm font-medium text-muted-foreground">
        <i data-lucide="search" class="w-4 h-4"></i><span>从已安装应用选择</span>
      </button>
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-muted-foreground">指令名称</label>
        <input id="f-name" class="field" placeholder="例如：打开浏览器" />
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-muted-foreground">类型</label>
        <select id="f-type" class="field">
          <option value="url">网址</option>
          <option value="app">应用 (AUMID)</option>
          <option value="file">本地文件 / 程序</option>
        </select>
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-muted-foreground">目标路径 / 网址 / AUMID</label>
        <input id="f-target" class="field" placeholder="https://www.google.com" />
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-muted-foreground">图标</label>
        <select id="f-icon" class="field">
          <option value="globe">🌐 网页</option>
          <option value="file-text">📄 文档</option>
          <option value="folder">📁 文件夹</option>
          <option value="monitor">🖥️ 应用</option>
          <option value="play">▶️ 播放</option>
          <option value="sparkles">✨ 闪光</option>
          <option value="message-circle">💬 对话</option>
          <option value="terminal">⌘ 终端</option>
          <option value="music">🎵 音乐</option>
          <option value="image">🖼️ 图片</option>
        </select>
      </div>
      <div class="flex gap-2 mt-1">
        <button id="btn-cancel" class="btn btn-ghost flex-1 py-2 rounded-[var(--brand-radius-sm)] text-sm font-medium">取消</button>
        <button id="btn-save" class="btn btn-primary flex-1 py-2 rounded-[var(--brand-radius-sm)] text-sm font-medium">保存</button>
      </div>
    </div>
  </div>
</main>

<!-- ============ 设置 ============ -->
<main id="view-settings" class="view view-scroll">
  <div class="max-w-[400px] mx-auto px-4 py-6 flex flex-col gap-5">
    <!-- Header -->
    <div class="flex items-center gap-3">
      <button id="btn-settings-back" class="btn w-9 h-9 rounded-full flex items-center justify-center hover:bg-muted shrink-0">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
      <div class="flex-1">
        <h1 class="text-xl font-bold tracking-tight">设置</h1>
      </div>
    </div>

    <!-- 加油哇~ 设置卡片 -->
    <div class="bg-card border border-border rounded-[var(--brand-radius-md)] p-4 flex flex-col gap-3" style="box-shadow:var(--shadow-1)">
      <!-- 开关行 -->
      <div class="flex items-center justify-between">
        <div class="flex flex-col gap-1">
          <p class="text-sm font-medium">加油哇~</p>
          <p class="text-xs text-muted-foreground">开启后桌宠会按设定间隔循环加油</p>
        </div>
        <label class="relative inline-flex items-center cursor-pointer shrink-0">
          <input type="checkbox" id="toggle-idle" class="sr-only peer" checked />
          <div class="w-11 h-6 bg-muted rounded-full peer peer-checked:bg-[var(--brand-primary)] transition-colors"></div>
          <div class="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full transition-transform peer-checked:translate-x-5"></div>
        </label>
      </div>
      <!-- 分隔线 -->
      <div class="h-px bg-border"></div>
      <!-- 间隔配置行 -->
      <div class="flex items-center gap-2">
        <span class="text-sm">小Leo每隔</span>
        <input id="input-interval" type="text" inputmode="numeric" class="field" style="width:64px; height:32px; text-align:center; padding:0 4px; font-size:14px;" value="60" />
        <span class="text-sm">秒给你加油喔~</span>
      </div>
    </div>

    <!-- 检查更新行 -->
    <div class="bg-card border border-border rounded-[var(--brand-radius-md)] p-4" style="box-shadow:var(--shadow-1)">
      <button id="row-check-update" class="w-full flex items-center justify-between cursor-pointer text-left">
        <div class="flex flex-col gap-1">
          <p class="text-sm font-medium">检查更新</p>
          <p id="update-version-line" class="text-xs text-muted-foreground">点击检查新版本</p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <span id="dot-update-row" class="hidden w-2.5 h-2.5 rounded-full" style="background:var(--state-error)"></span>
          <i data-lucide="chevron-right" class="w-5 h-5 text-muted-foreground"></i>
        </div>
      </button>
    </div>
  </div>
</main>

<!-- ============ 应用选择浮层 ============ -->
<div id="app-picker" class="hidden fixed inset-0 z-50 flex items-end justify-center p-4" style="background:rgba(45,36,32,0.4)">
  <div class="w-full max-w-[400px] bg-card rounded-[var(--brand-radius-lg)] flex flex-col" style="box-shadow:var(--shadow-2); max-height:80vh">
    <div class="flex items-center gap-2 p-3 border-b border-border">
      <i data-lucide="search" class="w-4 h-4 text-muted-foreground shrink-0"></i>
      <input id="picker-search" class="flex-1 outline-none bg-transparent text-sm" placeholder="搜索应用名称..." />
      <button id="picker-close" type="button" class="text-muted-foreground hover:text-foreground shrink-0"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div id="picker-list" class="overflow-y-auto flex-1 p-2 flex flex-col gap-0.5"></div>
  </div>
</div>

<!-- ============ 更新详情浮层 ============ -->
<div id="update-dialog" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(45,36,32,0.4)">
  <div class="w-full max-w-[400px] bg-card rounded-[var(--brand-radius-lg)] flex flex-col overflow-hidden" style="box-shadow:var(--shadow-2); max-height:80vh">
    <div class="flex items-center justify-between p-4 border-b border-border">
      <h2 id="upd-title" class="text-base font-bold tracking-tight">检查更新</h2>
      <button id="upd-close" type="button" class="text-muted-foreground hover:text-foreground shrink-0"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="flex flex-col gap-3 p-4 overflow-y-auto">
      <div class="flex items-center gap-2 text-sm">
        <span class="text-muted-foreground">当前版本</span>
        <span id="upd-current" class="font-medium">-</span>
      </div>
      <div class="flex items-center gap-2 text-sm">
        <span class="text-muted-foreground">最新版本</span>
        <span id="upd-latest" class="font-medium">-</span>
      </div>
      <div id="upd-notes-wrap" class="hidden">
        <div class="h-px bg-border my-1"></div>
        <p class="text-sm font-medium mb-1">更新说明</p>
        <div id="upd-notes" class="text-sm text-muted-foreground whitespace-pre-wrap leading-relaxed"></div>
      </div>
    </div>
    <div class="flex gap-2 p-4 border-t border-border">
      <button id="upd-cancel" class="btn btn-ghost flex-1 py-2 rounded-[var(--brand-radius-sm)] text-sm font-medium">取消</button>
      <button id="upd-apply" class="btn btn-primary flex-1 py-2 rounded-[var(--brand-radius-sm)] text-sm font-medium hidden">立即更新</button>
    </div>
  </div>
</div>

<script>
let commands = [];
let editingIndex = -1;
let drag = null;       // 拖拽状态对象
let updateState = null;   // check_update() 的结果

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function init(){
  try { await refreshStatus(); } catch(e){}
  try { await loadCommands(); } catch(e){}
  try { await loadNickname(); } catch(e){}
  try { await refreshUpdate(); } catch(e){}
  lucide.createIcons();
  setInterval(()=>{ refreshStatus().catch(()=>{}); }, 2000);
  // 通知 Python 页面加载完成，显示窗口并关闭 splash
  try { await window.pywebview.api.page_loaded(); } catch(e){}
}

// ---------- 昵称 ----------
let curNickname = '小Leo';
async function loadNickname(){
  try {
    const s = await window.pywebview.api.get_settings();
    curNickname = s.nickname || '小Leo';
  } catch(e) {}
  $('nickname-display').textContent = curNickname;
  $('nickname-input').value = curNickname;
  resizeNickInput();
}

// 测量输入框文字宽度，让输入框自适应文字长度
function resizeNickInput(){
  const input = $('nickname-input');
  const canvas = $('nick-measure');
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 16px "Microsoft YaHei UI", "PingFang SC", sans-serif';
  const text = input.value || '小Leo';
  const w = ctx.measureText(text).width;
  // 宽度 = 文字宽度 + 左右padding(12px) + 边框(2px) + 余量(4px)
  input.style.width = Math.ceil(w) + 18 + 'px';
}

function enterEditNickname(){
  $('nickname-view').classList.add('hidden');
  $('nickname-edit').classList.remove('hidden');
  $('nickname-edit').classList.add('flex');
  const input = $('nickname-input');
  input.value = curNickname;
  resizeNickInput();
  input.focus();
  input.select();
}

async function saveNickname(){
  const input = $('nickname-input');
  let v = input.value.trim();
  if (!v) v = '小Leo';
  const changed = v !== curNickname;
  curNickname = v;
  if (changed){
    try {
      const s = await window.pywebview.api.get_settings();
      await window.pywebview.api.save_settings({
        idle_bubble_enabled: s.idle_bubble_enabled !== false,
        idle_timeout: s.idle_timeout || 60,
        nickname: v
      });
    } catch(e) {}
  }
  $('nickname-display').textContent = v;
  $('nickname-edit').classList.add('hidden');
  $('nickname-edit').classList.remove('flex');
  $('nickname-view').classList.remove('hidden');
  lucide.createIcons();
}

$('btn-edit-nickname').addEventListener('click', enterEditNickname);
$('nickname-input').addEventListener('input', resizeNickInput);
$('nickname-input').addEventListener('blur', saveNickname);
$('nickname-input').addEventListener('keydown', (e)=>{
  if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
  if (e.key === 'Escape') { e.target.value = curNickname; e.target.blur(); }
});

async function refreshStatus(){
  const running = await window.pywebview.api.get_status();
  const dot = $('status-dot'), txt = $('status-text');
  if (running){
    dot.style.backgroundColor = 'var(--state-success)';
    txt.textContent = 'Leo运行中';
  } else {
    dot.style.backgroundColor = 'var(--brand-muted-foreground)';
    txt.textContent = 'Leo未启动';
  }
}

async function loadCommands(){
  commands = await window.pywebview.api.get_commands();
  renderCommands();
}

function renderCommands(){
  const list = $('command-list');
  list.innerHTML = '';
  if (!commands.length){
    list.innerHTML = '<p class="text-center text-sm text-muted-foreground py-6">还没有快捷指令，点击下方添加</p>';
    lucide.createIcons();
    return;
  }
  commands.forEach((cmd, i) => {
    const div = document.createElement('div');
    div.className = 'cmd-item flex items-center gap-3 bg-card border border-border rounded-[var(--brand-radius-md)] px-4 py-3';
    div.style.boxShadow = 'var(--shadow-1)';
    div.dataset.idx = i;
    div.innerHTML = `
      <div class="cmd-grip shrink-0 text-muted-foreground/30" data-grip="1">
        <i data-lucide="grip-vertical" class="w-4 h-4"></i>
      </div>
      <div class="w-9 h-9 rounded-[var(--brand-radius-sm)] bg-muted flex items-center justify-center shrink-0">
        <i data-lucide="${esc(cmd.icon||'app')}" class="w-5 h-5" style="color:var(--brand-primary)"></i>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium leading-tight">${esc(cmd.name)}</p>
        <p class="text-xs text-muted-foreground truncate mt-0.5">${esc(cmd.target)}</p>
      </div>
      <button class="cmd-del w-7 h-7 rounded-full flex items-center justify-center text-muted-foreground hover:bg-[var(--state-error)]/10" style="color:var(--state-error)" title="删除">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>`;

    // 拖拽排序：仅从 grip 手柄发起，鼠标事件实现
    div.addEventListener('mousedown', (e) => {
      if (!e.target.closest('[data-grip]')) return;
      startDrag(e, i, div);
    });

    div.querySelector('.cmd-del').addEventListener('click', (e)=>{ e.stopPropagation(); deleteCommand(i); });
    div.addEventListener('click', ()=> editCommand(i));
    list.appendChild(div);
  });
  lucide.createIcons();
}

// ========== 拖拽排序（鼠标事件实现，约束在列表区域内）==========
function startDrag(e, idx, item){
  e.preventDefault();
  const list = $('command-list');
  const itemRect = item.getBoundingClientRect();
  const listRect = list.getBoundingClientRect();

  // 创建幽灵克隆（跟随鼠标，约束在列表垂直范围内）
  const ghost = item.cloneNode(true);
  ghost.style.cssText = `position:fixed; width:${itemRect.width}px; left:${itemRect.left}px;`
    + ` top:${itemRect.top}px; z-index:100; opacity:0.85; pointer-events:none;`
    + ` box-shadow:0 8px 24px rgba(45,36,32,0.2); border:1px solid var(--brand-primary);`
    + ` border-radius:var(--brand-radius-md); background:var(--brand-card);`;
  document.body.appendChild(ghost);

  // 原始条目半透明
  item.style.opacity = '0.25';

  // 插入位置指示线
  const indicator = document.createElement('div');
  indicator.className = 'drag-indicator';

  drag = {
    idx, item, ghost, indicator,
    offsetY: e.clientY - itemRect.top,
    ghostH: itemRect.height,
    listRect, targetIdx: idx
  };

  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
}

function onDragMove(e){
  if (!drag) return;
  e.preventDefault();

  // 幽灵跟随鼠标，约束在列表垂直范围内
  let top = e.clientY - drag.offsetY;
  const minTop = drag.listRect.top;
  const maxTop = drag.listRect.bottom - drag.ghostH;
  top = Math.max(minTop, Math.min(maxTop, top));
  drag.ghost.style.top = top + 'px';

  // 计算插入位置：遍历所有条目（含被拖拽的），按鼠标 Y 与各条目中点比较
  const list = $('command-list');
  const allItems = Array.from(list.querySelectorAll('.cmd-item'));
  const otherItems = allItems.filter((_, i) => i !== drag.idx);

  let insertBefore = null;
  for (const el of otherItems) {
    const rect = el.getBoundingClientRect();
    if (e.clientY < rect.top + rect.height / 2) {
      insertBefore = el;
      break;
    }
  }

  // targetIdx = 在 otherItems 中的插入位置（= 移除拖拽项后的 commands 索引）
  let targetIdx;
  if (insertBefore === null) {
    targetIdx = otherItems.length;
  } else {
    targetIdx = otherItems.indexOf(insertBefore);
  }

  // 更新指示线位置
  if (targetIdx !== drag.targetIdx) {
    drag.targetIdx = targetIdx;
    if (drag.indicator.parentNode) drag.indicator.parentNode.removeChild(drag.indicator);
    if (insertBefore) {
      list.insertBefore(drag.indicator, insertBefore);
    } else if (otherItems.length > 0) {
      otherItems[otherItems.length - 1].after(drag.indicator);
    } else {
      list.appendChild(drag.indicator);
    }
    drag.indicator.style.opacity = '1';
  }
}

function onDragEnd(e){
  if (!drag) return;
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);

  const reordered = drag.targetIdx !== drag.idx;

  // 执行排序
  if (reordered) {
    const moved = commands.splice(drag.idx, 1)[0];
    commands.splice(drag.targetIdx, 0, moved);
    window.pywebview.api.save_commands(commands);
  }

  // 清理幽灵和指示线
  drag.ghost.remove();
  drag.item.style.opacity = '';
  if (drag.indicator.parentNode) drag.indicator.parentNode.removeChild(drag.indicator);
  drag = null;

  // 仅在发生排序时重新渲染（避免无操作时的闪烁）
  if (reordered) renderCommands();
}

function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $(id).classList.add('active');
  lucide.createIcons();
}

function showForm(){
  $('form-card').classList.remove('hidden');
  $('form-title').textContent = editingIndex >= 0 ? '编辑指令' : '新增指令';
}
function hideForm(){ $('form-card').classList.add('hidden'); }

function addCommand(){
  editingIndex = -1;
  $('f-name').value = '';
  $('f-type').value = 'url';
  $('f-target').value = '';
  $('f-icon').value = 'globe';
  showForm();
}

function editCommand(i){
  editingIndex = i;
  const c = commands[i] || {};
  $('f-name').value = c.name || '';
  $('f-type').value = c.type || 'url';
  $('f-target').value = c.target || '';
  $('f-icon').value = c.icon || 'globe';
  showForm();
}

async function saveCommand(){
  const cmd = {
    name: $('f-name').value.trim(),
    type: $('f-type').value,
    target: $('f-target').value.trim(),
    icon: $('f-icon').value
  };
  if (!cmd.name || !cmd.target){ alert('请填写名称和目标'); return; }
  if (editingIndex >= 0) commands[editingIndex] = cmd;
  else commands.push(cmd);
  await window.pywebview.api.save_commands(commands);
  hideForm();
  renderCommands();
}

async function deleteCommand(i){
  commands.splice(i, 1);
  await window.pywebview.api.save_commands(commands);
  renderCommands();
}

async function startPet(){
  await window.pywebview.api.start_pet();
  setTimeout(()=>refreshStatus().catch(()=>{}), 1500);
}

$('btn-start').addEventListener('click', startPet);
$('btn-commands').addEventListener('click', ()=>{ showView('view-commands'); });
$('btn-back').addEventListener('click', ()=>{ showView('view-home'); });
$('btn-add').addEventListener('click', addCommand);
$('btn-cancel').addEventListener('click', hideForm);
$('btn-save').addEventListener('click', saveCommand);

// ---------- 设置 ----------
$('btn-settings').addEventListener('click', async ()=>{
  showView('view-settings');
  try {
    const s = await window.pywebview.api.get_settings();
    $('toggle-idle').checked = s.idle_bubble_enabled !== false;
    $('input-interval').value = s.idle_timeout || 60;
    lucide.createIcons();
  } catch(e){}
});
// 输入框仅允许数字
$('input-interval').addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/[^0-9]/g, '');
});

// ---------- 自动保存设置 ----------
// 设置间隔/开关只存在内存，离开设置页（返回主页）时保存
async function saveSettingsAuto(){
  const enabled = $('toggle-idle').checked;
  let timeout = parseInt($('input-interval').value);
  if (!timeout || timeout < 1) timeout = 60;
  try {
    await window.pywebview.api.save_settings({
      idle_bubble_enabled: enabled,
      idle_timeout: timeout,
      nickname: curNickname
    });
  } catch(e) {}
}
let settingsDirty = false;
function markSettingsDirty(){ settingsDirty = true; }
$('toggle-idle').addEventListener('change', markSettingsDirty);
$('input-interval').addEventListener('input', markSettingsDirty);
// 返回主页时自动保存
$('btn-settings-back').addEventListener('click', async () => {
  if (settingsDirty){
    settingsDirty = false;
    await saveSettingsAuto();
  }
  showView('view-home');
});
// 从设置页切到其他视图（如底部导航）也触发保存——暂无其他入口，保持简单

// ---------- 应用选择浮层 ----------
let allApps = [];
function openPicker(){
  $('app-picker').classList.remove('hidden');
  $('picker-search').value = '';
  $('picker-list').innerHTML = '<p class="text-center text-sm text-muted-foreground py-6">加载中...</p>';
  lucide.createIcons();
  if (!allApps.length){
    window.pywebview.api.list_apps().then(apps => {
      allApps = apps || [];
      allApps.forEach((a,i) => a._idx = i);
      renderPicker('');
    }).catch(() => {
      $('picker-list').innerHTML = '<p class="text-center text-sm text-muted-foreground py-6">加载失败</p>';
    });
  } else {
    renderPicker('');
  }
  setTimeout(() => $('picker-search').focus(), 50);
}
function closePicker(){ $('app-picker').classList.add('hidden'); }
function renderPicker(q){
  q = (q || '').trim().toLowerCase();
  const list = $('picker-list');
  const filtered = q ? allApps.filter(a => (a.name || '').toLowerCase().includes(q)) : allApps;
  if (!filtered.length){
    list.innerHTML = '<p class="text-center text-sm text-muted-foreground py-6">未找到匹配应用</p>';
    lucide.createIcons();
    return;
  }
  list.innerHTML = filtered.slice(0, 200).map(a => {
    const tag = a.type === 'app' ? '应用' : '程序';
    return `<div class="picker-item flex items-center gap-3 px-3 py-2 rounded-[var(--brand-radius-sm)] hover:bg-muted cursor-pointer" data-idx="${a._idx}">
      <div class="w-8 h-8 rounded-[var(--brand-radius-sm)] bg-muted flex items-center justify-center shrink-0">
        <i data-lucide="app-window" class="w-4 h-4" style="color:var(--brand-primary)"></i>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium leading-tight truncate">${esc(a.name)}</p>
        <p class="text-xs text-muted-foreground truncate">${esc(a.target)}</p>
      </div>
      <span class="text-xs text-muted-foreground bg-muted px-1.5 py-0.5 rounded shrink-0">${tag}</span>
    </div>`;
  }).join('');
  lucide.createIcons();
  list.querySelectorAll('.picker-item').forEach(el => {
    el.addEventListener('click', () => pickApp(parseInt(el.dataset.idx)));
  });
}
function pickApp(idx){
  const a = allApps[idx];
  if (!a) return;
  $('f-name').value = a.name;
  $('f-type').value = a.type;
  $('f-target').value = a.target;
  $('f-icon').value = 'monitor';
  closePicker();
  lucide.createIcons();
}
$('btn-pick-app').addEventListener('click', openPicker);
$('picker-close').addEventListener('click', closePicker);
$('picker-search').addEventListener('input', e => renderPicker(e.target.value));
$('app-picker').addEventListener('click', e => { if (e.target === $('app-picker')) closePicker(); });

// ---------- 检查更新 ----------
async function refreshUpdate(){
  try {
    updateState = await window.pywebview.api.check_update();
  } catch(e) {
    updateState = { ok: false, has_update: false };
    return;
  }
  const has = !!(updateState && updateState.ok && updateState.has_update);
  $('dot-settings').classList.toggle('hidden', !has);
  $('dot-update-row').classList.toggle('hidden', !has);
  if (updateState && updateState.ok){
    $('update-version-line').textContent = has
      ? '发现新版本 ' + updateState.latest
      : '已是最新版本';
  }
}

function openUpdateDialog(){
  $('update-dialog').classList.remove('hidden');
  const st = updateState || {};
  const has = !!(st.ok && st.has_update);
  $('upd-title').textContent = has ? '发现新版本' : '已是最新版本';
  $('upd-current').textContent = st.current ? 'v' + st.current : '-';
  $('upd-latest').textContent = st.latest || '-';
  const notes = (st.notes || '').trim();
  $('upd-notes-wrap').classList.toggle('hidden', !notes);
  $('upd-notes').textContent = notes;
  $('upd-apply').classList.toggle('hidden', !has);
  $('upd-cancel').textContent = has ? '取消' : '知道了';
  lucide.createIcons();
}
function closeUpdateDialog(){
  $('update-dialog').classList.add('hidden');
}

let updating = false;
$('row-check-update').addEventListener('click', () => {
  openUpdateDialog();
});
$('upd-close').addEventListener('click', closeUpdateDialog);
$('upd-cancel').addEventListener('click', closeUpdateDialog);
$('update-dialog').addEventListener('click', e => {
  if (e.target === $('update-dialog')) closeUpdateDialog();
});
$('upd-apply').addEventListener('click', async () => {
  if (updating) return;
  updating = true;
  const btn = $('upd-apply');
  const span = btn.querySelector('span') || btn;
  span.textContent = '正在下载更新...';
  btn.disabled = true;
  try {
    await window.pywebview.api.apply_update();
  } catch(e) {
    alert('启动更新失败：' + e);
    span.textContent = '立即更新';
    btn.disabled = false;
    updating = false;
  }
});

// 后端下载完成后回调
window.onUpdateApplied = (res) => {
  if (res && res.ok){
    alert('更新完成，请重启管理软件生效');
    closeUpdateDialog();
    refreshUpdate().catch(()=>{});
  } else {
    alert((res && res.msg) ? res.msg : '更新失败，请稍后重试');
    const btn = $('upd-apply');
    if (btn){
      const span = btn.querySelector('span') || btn;
      span.textContent = '立即更新';
      btn.disabled = false;
    }
  }
  updating = false;
};

window.addEventListener('pywebviewready', init);
</script>
